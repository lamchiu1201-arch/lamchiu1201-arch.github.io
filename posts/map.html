<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DumbyMap – Markers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- 載入地圖套件 MapLibre GL CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  
  <!-- 載入 Markdown 解析器與樣式 -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.min.css">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      color: #24292f;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    #map {
      width: 100%;
      height: 400px;
      margin-top: 20px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
    }
    /* 表格樣式優化 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }
    th, td {
      border: 1px solid #d0d7de;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f6f8fa;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Markdown 內容渲染目標 -->
    <div id="content" class="markdown-body"></div>
    
    <!-- 地圖容器 -->
    <div id="map"></div>
  </div>

  <!-- 原始 Markdown 資料 -->
  <script type="text/markdown" id="md-content">
# Markers

DumbyMap provides 25+ predefined marker icons.
Each GeoLink can display a different icon type.


## Changing a marker type

1. Click a GeoLink to place a default marker on the map.
2. **Right-click** the GeoLink to open the context menu.
3. Choose **Set marker type** and pick an icon from the list.


## Adding markers manually

Right-click anywhere on the map and choose **Add marker** to drop a named pin.


## Available icons

| Category | Types |
|----------|-------|
| Basic | pin, circle |
| Recreation | campsite, mountain, waterfall, hotSpring, animal |
| Infrastructure | parking, rail, heliport, racetrack |
| Warning | caution, danger, cross, construction, fence, communication |
| Navigation | water |
| Shapes | star, triangle, triangleWhite, roadblock |

Use the `type` URL parameter to set the marker icon directly:

- <a href="geo:25.0478,121.5319?type=pin" class="geolink" data-lat="25.0478" data-lng="121.5319" data-title="Taipei Main Station">pin – Taipei Main Station</a>
- <a href="geo:25.0330,121.5654?type=star" class="geolink" data-lat="25.0330" data-lng="121.5654" data-title="Taipei 101">star – Taipei 101</a>
- <a href="geo:25.0797,121.5767?type=campsite" class="geolink" data-lat="25.0797" data-lng="121.5767" data-title="Songshan Airport area">campsite – Songshan Airport area</a>
- <a href="geo:25.0523,121.5436?type=mountain" class="geolink" data-lat="25.0523" data-lng="121.5436" data-title="Zhongzheng District">mountain – Zhongzheng District</a>
- <a href="geo:25.0408,121.5700?type=caution" class="geolink" data-lat="25.0408" data-lng="121.5700" data-title="Da'an District">caution – Da'an District</a>

## Map
  </script>

  <script>
    // 1. 解析並渲染 Markdown 內容
    const md = window.markdownit({ html: true });
    const rawMd = document.getElementById('md-content').textContent;
    document.getElementById('content').innerHTML = md.render(rawMd);

    // 2. 初始化 MapLibre GL 互動式地圖
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      'osm-tiles': {
        type: 'raster',
        tiles: [
          'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ],
        tileSize: 256,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    },
    layers: [
      {
        id: 'osm-tiles-layer',
        type: 'raster',
        source: 'osm-tiles',
        minzoom: 0,
        maxzoom: 19
      }
    ]
  },
  center: [121.5500, 25.0500],
  zoom: 12
});

    map.addControl(new maplibregl.NavigationControl());

    // 預設標記清單
    const locations = [
      { lng: 121.5319, lat: 25.0478, title: "pin – Taipei Main Station" },
      { lng: 121.5654, lat: 25.0330, title: "star – Taipei 101" },
      { lng: 121.5767, lat: 25.0797, title: "campsite – Songshan Airport area" },
      { lng: 121.5436, lat: 25.0523, title: "mountain – Zhongzheng District" },
      { lng: 121.5700, lat: 25.0408, title: "caution – Da'an District" }
    ];

    // 在地圖上加上 Marker
    locations.forEach(loc => {
      new maplibregl.Marker()
        .setLngLat([loc.lng, loc.lat])
        .setPopup(new maplibregl.Popup().setText(loc.title))
        .addTo(map);
    });

    // 點擊文字連結時平滑移動地圖至該點
    document.querySelectorAll('.geolink').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const lat = parseFloat(link.getAttribute('data-lat'));
        const lng = parseFloat(link.getAttribute('data-lng'));
        map.flyTo({ center: [lng, lat], zoom: 14 });
      });
    });
  </script>
</body>
</html>
