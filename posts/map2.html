<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DumbyMap – Markers with Photos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- 載入地圖套件 MapLibre GL CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  
  <!-- 載入 Markdown 解析器與樣式 -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.min.css">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      color: #24292f;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    #map {
      width: 100%;
      height: 500px;
      margin-top: 20px;
      border-radius: 8px;
      border: 1px solid #d0d7de;
    }
    
    /* 彈出視窗 (Popup) 內容樣式設定 */
    .popup-card {
      text-align: center;
      padding: 4px;
      max-width: 200px;
    }
    .popup-card h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #333;
    }
    .popup-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="content" class="markdown-body"></div>
    <div id="map"></div>
  </div>

  <script type="text/markdown" id="md-content">
# Markers with Photos

點擊地圖上的地標點（Marker），即可查看地名與圖片。
  </script>

  <script>
    // 1. 渲染 Markdown
    const md = window.markdownit({ html: true });
    const rawMd = document.getElementById('md-content').textContent;
    document.getElementById('content').innerHTML = md.render(rawMd);

    // 2. 初始化地圖 (使用 CARTO 乾淨明亮圖層)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [121.5500, 25.0500],
      zoom: 12
    });

    map.addControl(new maplibregl.NavigationControl());

    // 3. 在資料陣列中加入 image (圖片網址)
    const locations = [
      {
        lng: 121.5319,
        lat: 25.0478,
        title: "台北車站",
        image: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=400&q=80"
      },
      {
        lng: 121.5654,
        lat: 25.0330,
        title: "台北 101",
        image: "https://images.unsplash.com/photo-1508248467877-1731527b13dd?w=400&q=80"
      },
      {
        lng: 121.5767,
        lat: 25.0797,
        title: "松山機場",
        image: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=400&q=80"
      },
      {
        lng: 121.5360,
        lat: 25.0260,
        title: "大安森林公園",
        image: "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=400&q=80"
      }
    ];

    // 4. 循環建立 Marker 與 Popup
    locations.forEach(loc => {
      // 組合 HTML 卡片內容
      const popupHtml = `
        <div class="popup-card">
          <h3>${loc.title}</h3>
          <img src="${loc.image}" alt="${loc.title}">
        </div>
      `;

      // 建立 Popup
      const popup = new maplibregl.Popup({ offset: 25 })
        .setHTML(popupHtml); // 使用 setHTML 填入 HTML 內容

      // 建立 Marker 並繫結 Popup
      new maplibregl.Marker({ color: '#e63946' }) // 可自訂顏色
        .setLngLat([loc.lng, loc.lat])
        .setPopup(popup) // 點擊時開啟 popup
        .addTo(map);
    });
  </script>
</body>
</html>
